<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>SPA Matching Engine - Tests</title>
    <style>
        body {
            font-family: 'Consolas', monospace;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }

        h1 {
            color: #00d9ff;
        }

        .pass {
            color: #00ff88;
        }

        .fail {
            color: #ff4444;
        }

        .summary {
            background: #2a2a4e;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        pre {
            background: #0a0a1e;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }

        button {
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            margin: 10px 5px 10px 0;
        }

        button:hover {
            background: #00b8d4;
        }

        #results {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>🧪 SPA Matching Engine - Tests de Validación</h1>
    <p>FASE 3 - Verificación de implementación</p>

    <button onclick="runTests()">▶️ Ejecutar Tests</button>
    <button onclick="clearResults()">🗑️ Limpiar</button>

    <div class="summary" id="summary" style="display:none;">
        <strong>Resumen:</strong>
        <span id="summaryText"></span>
    </div>

    <div id="results"></div>

    <script src="js/spa-matching-engine.js"></script>
    <script src="js/spa-matching-tests.js"></script>
    <script>
        function clearResults() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('summary').style.display = 'none';
        }

        async function runTests() {
            clearResults();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>⏳ Ejecutando tests...</p>';

            try {
                const report = await window.SpaMatchingTests.runAll();

                // Mostrar resumen
                document.getElementById('summary').style.display = 'block';
                const passRate = report.summary.passRate;
                const summaryClass = report.summary.failed === 0 ? 'pass' : 'fail';
                document.getElementById('summaryText').innerHTML = `
                    <span class="${summaryClass}">
                        ${report.summary.passed} pasados / ${report.summary.failed} fallidos 
                        (${passRate})
                    </span>
                `;

                // Mostrar detalles
                let html = '<h2>📋 Resultados Detallados</h2>';

                report.tests.forEach(test => {
                    const icon = test.status === 'PASS' ? '✅' : '❌';
                    const cls = test.status === 'PASS' ? 'pass' : 'fail';
                    html += `<p class="${cls}">${icon} ${test.test}</p>`;
                    if (test.details && test.status === 'FAIL') {
                        html += `<pre style="margin-left:20px">${test.details}</pre>`;
                    }
                });

                // JSON completo
                html += '<h2>📊 Report JSON</h2>';
                html += `<pre>${JSON.stringify(report, null, 2)}</pre>`;

                resultsDiv.innerHTML = html;

            } catch (err) {
                resultsDiv.innerHTML = `<p class="fail">❌ Error ejecutando tests: ${err.message}</p><pre>${err.stack}</pre>`;
            }
        }

        // Auto-run on load
        // setTimeout(runTests, 500);
    </script>
</body>

</html>
