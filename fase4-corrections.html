<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>FASE 4 - Correcciones de Datos Reales</title>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        h2 {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 0;
        }

        .section {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }

        .section h3 {
            color: #f8fafc;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pass {
            color: #22c55e;
        }

        .warn {
            color: #f59e0b;
        }

        .fail {
            color: #ef4444;
        }

        .info {
            color: #38bdf8;
        }

        button {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 8px;
            margin: 8px 8px 8px 0;
            font-weight: 600;
        }

        button:hover {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
        }

        button.danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        button.danger:hover {
            background: linear-gradient(135deg, #f87171, #ef4444);
        }

        pre {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
        }

        .stat {
            display: inline-block;
            background: #334155;
            padding: 8px 16px;
            border-radius: 6px;
            margin: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #94a3b8;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
        }

        #log {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 12px;
        }
    </style>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>

<body>
    <h1>🔧 FASE 4 - Correcciones Funcionales</h1>
    <h2>Aplicar modelo operativo sobre datos reales de Firestore</h2>

    <div class="section">
        <h3>⚙️ Controles</h3>
        <button onclick="runDryRun()">🔍 DRY-RUN (Ver cambios sin aplicar)</button>
        <button onclick="runApply()" class="danger">⚡ APLICAR CAMBIOS REALES</button>
        <button onclick="clearLog()">🗑️ Limpiar Log</button>
    </div>

    <div class="section" id="stats" style="display:none;">
        <h3>📊 Estadísticas</h3>
        <div id="statsContent"></div>
    </div>

    <div class="section">
        <h3>📝 Log de Ejecución</h3>
        <div id="log">Esperando ejecución...</div>
    </div>

    <!-- Scripts del sistema -->
    <script src="firebase-config.js"></script>
    <script src="js/spa-matching-engine.js"></script>
    <script src="js/spa-data-corrections.js"></script>
    <script src="js/spa-phase4-corrections.js"></script>

    <script>
        const logEl = document.getElementById('log');
        const statsEl = document.getElementById('stats');
        const statsContent = document.getElementById('statsContent');

        function log(msg, type = '') {
            const time = new Date().toLocaleTimeString();
            const colorClass = type ? `class="${type}"` : '';
            logEl.innerHTML += `<div ${colorClass}>[${time}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function clearLog() {
            logEl.innerHTML = 'Log limpiado. Esperando ejecución...';
            statsEl.style.display = 'none';
        }

        function showStats(report) {
            statsEl.style.display = 'block';
            statsContent.innerHTML = `
                <div class="stat">
                    <div class="stat-label">Precios</div>
                    <div class="stat-value info">${report.corrections.prices.corrected}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Terapeutas (Skills)</div>
                    <div class="stat-value info">${report.corrections.staff.corrected}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Salas</div>
                    <div class="stat-value info">${report.corrections.spaces.corrected}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Servicios</div>
                    <div class="stat-value info">${report.corrections.services.corrected}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Estado Pago</div>
                    <div class="stat-value info">${report.corrections.payment.corrected}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Parejas Válidas</div>
                    <div class="stat-value ${report.validations.couples.invalid > 0 ? 'warn' : 'pass'}">
                        ${report.validations.couples.valid}/${report.validations.couples.total}
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-label">Packs Válidos</div>
                    <div class="stat-value ${report.validations.packs.invalid > 0 ? 'warn' : 'pass'}">
                        ${report.validations.packs.valid}/${report.validations.packs.total}
                    </div>
                </div>
            `;
        }

        async function runDryRun() {
            clearLog();
            log('🔍 Iniciando DRY-RUN (sin cambios reales)...', 'info');

            try {
                // Verificar dependencias
                if (!window.SpaDataCorrections) {
                    log('❌ SpaDataCorrections no cargado', 'fail');
                    return;
                }
                if (typeof db === 'undefined') {
                    log('❌ Firestore (db) no disponible', 'fail');
                    return;
                }

                log('✅ Dependencias OK', 'pass');

                const report = await window.SpaDataCorrections.dryRun();

                // Mostrar resultados
                log('', '');
                log('═══════════════════════════════════════', 'info');
                log('📋 RESULTADOS DRY-RUN', 'info');
                log('═══════════════════════════════════════', 'info');

                log(`💰 Precios a corregir: ${report.corrections.prices.corrected}/${report.corrections.prices.processed}`,
                    report.corrections.prices.corrected > 0 ? 'warn' : 'pass');
                if (report.corrections.prices.details.length > 0) {
                    report.corrections.prices.details.slice(0, 5).forEach(d => {
                        log(`   → ${d.code}: ${d.old}€ → ${d.new}€ (${d.source})`, 'info');
                    });
                    if (report.corrections.prices.details.length > 5) {
                        log(`   ... y ${report.corrections.prices.details.length - 5} más`, '');
                    }
                }

                log(`👤 Terapeutas sin skills: ${report.corrections.staff.corrected}/${report.corrections.staff.processed}`,
                    report.corrections.staff.corrected > 0 ? 'warn' : 'pass');

                log(`🏠 Salas a actualizar: ${report.corrections.spaces.corrected}/${report.corrections.spaces.processed}`,
                    report.corrections.spaces.corrected > 0 ? 'warn' : 'pass');

                log(`📋 Servicios a actualizar: ${report.corrections.services.corrected}/${report.corrections.services.processed}`,
                    report.corrections.services.corrected > 0 ? 'warn' : 'pass');

                log(`💳 Bonos locales sin estado_pago: ${report.corrections.payment.corrected}/${report.corrections.payment.processed}`,
                    report.corrections.payment.corrected > 0 ? 'warn' : 'pass');

                log('', '');
                log(`💑 Servicios pareja: ${report.validations.couples.valid} válidos, ${report.validations.couples.invalid} con problemas`,
                    report.validations.couples.invalid > 0 ? 'warn' : 'pass');
                if (report.validations.couples.issues.length > 0) {
                    report.validations.couples.issues.forEach(issue => {
                        log(`   ⚠️ ${issue.nombre}: ${issue.issues.join(', ')}`, 'warn');
                    });
                }

                log(`📦 Packs mixtos: ${report.validations.packs.valid} válidos, ${report.validations.packs.invalid} con problemas`,
                    report.validations.packs.invalid > 0 ? 'warn' : 'pass');
                if (report.validations.packs.issues.length > 0) {
                    report.validations.packs.issues.forEach(issue => {
                        log(`   ⚠️ ${issue.nombre}: ${issue.issues.join(', ')}`, 'warn');
                    });
                }

                showStats(report);
                log('', '');
                log('✅ DRY-RUN completado. Revisa los cambios antes de aplicar.', 'pass');

                // Guardar report para referencia
                window.lastDryRunReport = report;

            } catch (err) {
                log(`❌ Error: ${err.message}`, 'fail');
                console.error(err);
            }
        }

        async function runApply() {
            if (!confirm('⚠️ ¿APLICAR CAMBIOS REALES A FIRESTORE?\n\nEsto modificará los datos del spa.')) {
                log('❌ Operación cancelada por el usuario', 'warn');
                return;
            }

            clearLog();
            log('⚡ Iniciando APLICACIÓN DE CAMBIOS REALES...', 'warn');

            try {
                if (!window.SpaDataCorrections || typeof db === 'undefined') {
                    log('❌ Dependencias no disponibles', 'fail');
                    return;
                }

                const report = await window.SpaDataCorrections.apply();

                log('', '');
                log('═══════════════════════════════════════', 'pass');
                log('✅ CAMBIOS APLICADOS', 'pass');
                log('═══════════════════════════════════════', 'pass');
                log(`💰 Precios corregidos: ${report.corrections.prices.corrected}`, 'pass');
                log(`👤 Terapeutas actualizados: ${report.corrections.staff.corrected}`, 'pass');
                log(`🏠 Salas actualizadas: ${report.corrections.spaces.corrected}`, 'pass');
                log(`📋 Servicios actualizados: ${report.corrections.services.corrected}`, 'pass');
                log(`💳 Bonos con estado_pago: ${report.corrections.payment.corrected}`, 'pass');

                showStats(report);

                window.lastApplyReport = report;

            } catch (err) {
                log(`❌ Error: ${err.message}`, 'fail');
                console.error(err);
            }
        }

        // Auto-check on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (typeof db !== 'undefined') {
                    log('✅ Firestore conectado', 'pass');
                } else {
                    log('⚠️ Firestore no disponible - Revisa js/db.js', 'warn');
                }
                if (window.SpaMatchingEngine) {
                    log('✅ SpaMatchingEngine cargado', 'pass');
                } else {
                    log('⚠️ SpaMatchingEngine no cargado', 'warn');
                }
                if (window.SpaDataCorrections) {
                    log('✅ SpaDataCorrections cargado', 'pass');
                } else {
                    log('⚠️ SpaDataCorrections no cargado', 'warn');
                }
            }, 1000);
        });
    </script>
</body>

</html>
